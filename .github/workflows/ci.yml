name: Check CiteWise
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: pip install -r backend/requirements.txt
      - run: pytest -q
      - run: python scripts/create_samples.py
      - run: npm ci && npm run build && npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Browser smoke tests
        run: |
          APP_ORIGIN=http://127.0.0.1:8000 uvicorn app.main:create_app --factory --app-dir backend --host 127.0.0.1 --port 8000 > /tmp/citewise.log 2>&1 &
          for attempt in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8000/api/health && break
            sleep 1
          done
          cd frontend
          npm run test:e2e
